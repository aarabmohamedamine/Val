<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>V1</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main>
      <section id="intro-screen" class="card-container">
        <p id="intro-small-text"></p>
        <h1 id="intro-title"></h1>
        <p id="intro-text"></p>
        <button id="open-btn">Open ❤️</button>
      </section>

      <section id="unlock-screen" class="card-container">
        <h2>For <span id="recipient-name"></span> ❤️</h2>
        <p id="unlock-text"></p>
        <p id="date-question"></p>
        <input id="date-input" type="text" placeholder="DD/MM/YYYY" />
        <button id="unlock-btn">Unlock</button>
        <p id="error-message"></p>
      </section>

      <section id="memories-screen">
        <p>Chapter One · Our Memories</p>
        <h2>Some moments deserve their own place ❤️</h2>
        <div class="memories-container" id="memories-container">

        </div>

        <button id="continue-btn">Continue ❤️</button>

      </section>

      <section id="messages-screen">
        <p>Chapter Two . Just For You</p>
        <h2>Open When... </h2>
        <div class="messages-container" id="messages-container">

        </div>
        <button id="final-btn">Continue ❤️</button>
      </section>

      <section id="final-screen">

          <div class="final-card">

              <p>Final Chapter</p>

              <h2 id="final-title"></h2>

              <p id="final-paragraph1"></p>

              <p id="final-paragraph2"></p>

              <button id="surprise-btn">
                  One last surprise ✨
              </button>

              <p id="surprise-message"></p>

          </div>

      </section>
    <audio id="background-music" loop></audio>

    <button id="music-btn" class="music-btn">
    🎵
    </button>
    <script src="js/config.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
